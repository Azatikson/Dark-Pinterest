<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkPin — тёмный Pinterest</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo" id="logo-home" title="Главная">
                <span class="logo-letter">P</span>
            </div>
            <button id="home-btn" class="nav-btn active" title="Главная">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3.1l8.5 7.6v9.2c0 .6-.5 1.1-1.1 1.1h-5.3v-6h-4.2v6H4.6c-.6 0-1.1-.5-1.1-1.1v-9.2L12 3.1m0-2.1L2 10.2V21c0 1.1.9 2 2 2h6v-7h4v7h6c1.1 0 2-.9 2-2V10.2L12 1z"/>
                </svg>
            </button>
            <button id="profile-btn" class="nav-btn" title="Ваши пины">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </button>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <div class="search-wrapper">
                    <input type="text" id="search-input" placeholder="Поиск пинов..." autocomplete="off">
                    <button id="add-pin-btn-top" class="add-pin-inside" title="Добавить пин">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                    </button>
                </div>

                <div class="user-menu" id="user-menu">
                    <button class="profile-avatar" id="profile-avatar" title="Аккаунт">
                        <img src="https://i.pinimg.com/736x/7a/88/ff/7a88fffe284fb914b51d6ecac2bbc766.jpg" alt="Профиль">
                        <span class="arrow-down">▼</span>
                    </button>
                    <div class="dropdown-menu" id="dropdown-menu">
                        <div class="dropdown-header">
                            <img src="https://i.pinimg.com/736x/7a/88/ff/7a88fffe284fb914b51d6ecac2bbc766.jpg" alt="Аватар" class="dropdown-avatar">
                            <div>
                                <p class="dropdown-username">Имя пользователя</p>
                                <button class="dropdown-business-btn">Перейти на бизнес-аккаунт</button>
                            </div>
                        </div>
                        <div class="dropdown-divider"></div>
                        <p class="dropdown-label">Ваши аккаунты</p>
                        <div class="dropdown-account">
                            <img src="https://i.pinimg.com/736x/7a/88/ff/7a88fffe284fb914b51d6ecac2bbc766.jpg" alt="Аватар" class="dropdown-avatar-small">
                            <span class="dropdown-account-name">Имя пользователя</span>
                            <span class="dropdown-check">✓</span>
                        </div>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item" id="add-account-btn">➕ Добавить аккаунт</button>
                        <button class="dropdown-item" id="logout-btn">🚪 Выйти</button>
                    </div>
                </div>
            </div>

            <div id="profile-section" class="profile-section hidden">
                <div class="profile-header">
                    <div class="profile-info">
                        <img src="https://i.pinimg.com/736x/7a/88/ff/7a88fffe284fb914b51d6ecac2bbc766.jpg" alt="Аватар" class="profile-avatar-large">
                        <div>
                            <h2 class="profile-username">Имя пользователя</h2>
                            <p class="profile-subscribers">Подписчики: 123</p>
                        </div>
                    </div>
                    <div class="profile-actions">
                        <button id="share-profile-btn" class="secondary-btn">Поделиться</button>
                        <button id="create-pin-btn-profile" class="secondary-btn">Создать</button>
                    </div>
                </div>
                <div class="profile-tabs">
                    <button class="profile-tab active" data-tab="pins">Пины</button>
                    <button class="profile-tab" data-tab="boards">Доски</button>
                    <button class="profile-tab" data-tab="collages">Коллажи</button>
                </div>
                <div id="tab-pins" class="profile-tab-content pins-grid"></div>
                <div id="tab-boards" class="profile-tab-content hidden">Здесь будут ваши доски</div>
                <div id="tab-collages" class="profile-tab-content hidden">Здесь будут ваши коллажи</div>
            </div>

            <div id="pins-grid" class="pins-grid"></div>
        </main>
    </div>

    <div id="add-pin-modal" class="modal">
        <div class="modal-content">
            <button id="close-modal" class="modal-close" aria-label="Закрыть">×</button>
            <h3>Новый пин</h3>
            <div class="form-group">
                <label for="pin-title">Название</label>
                <input type="text" id="pin-title" placeholder="Введите название">
            </div>
            <div class="form-group">
                <label for="pin-image-url">Ссылка на изображение</label>
                <input type="url" id="pin-image-url" placeholder="https://example.com/image.jpg">
            </div>
            <div class="form-group">
                <label>Или загрузите с устройства</label>
                <input type="file" id="pin-image-file" accept="image/*">
            </div>
            <button id="save-pin" class="primary-btn">Сохранить</button>
        </div>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
